name: Social_Hub CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: socialhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma Schema & Generate Client
        run: |
          npx prisma validate
          npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/socialhub_test?schema=public"

      - name: Lint Backend
        run: npm run lint

      - name: Run Backend Unit & Regression Tests
        run: npm test
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/socialhub_test?schema=public"
          REDIS_URL: "redis://localhost:6379"
          ACCESS_TOKEN_SECRET: "ci_test_access_token_secret_32_characters_minimum"
          REFRESH_TOKEN_SECRET: "ci_test_refresh_token_secret_32_characters_minimum"

      - name: Build Backend
        run: npm run build

  frontend-checks:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint Frontend
        run: npm run lint

      - name: Type Check Frontend
        run: npx tsc --noEmit

      - name: Run Frontend Unit Tests
        run: npm test

      - name: Build Frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:5000/graphql"
          NEXT_PUBLIC_WS_URL: "ws://localhost:5000/graphql"
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:5000"
          NEXT_TELEMETRY_DISABLED: 1

  docker-checks:
    name: Docker Configuration Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Default Docker Compose
        run: docker compose config

      - name: Validate Development Docker Compose
        run: docker compose -f docker-compose.dev.yml config

      - name: Validate Production Docker Compose
        run: docker compose -f docker-compose.prod.yml --env-file .env.production.example config
