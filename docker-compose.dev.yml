# Docker Compose configuration for Local Development
# Runs local PostgreSQL and Redis containers, and optionally runs backend/frontend with live reload.
#
# Quick commands:
# 1. Run local database and Redis only (for running backend/frontend directly on your host machine):
#    docker compose -f docker-compose.dev.yml up -d postgres redis
#
# 2. Run the entire development stack in Docker (with code volumes for hot-reload):
#    docker compose -f docker-compose.dev.yml up

services:
  postgres:
    image: postgres:16-alpine
    container_name: socialhub-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-socialhub}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - socialhub-dev-network

  redis:
    image: redis:7-alpine
    container_name: socialhub-dev-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - socialhub-dev-network

  backend:
    image: node:22-slim
    container_name: socialhub-dev-backend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/socialhub?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_TLS: "false"
      CLIENT_URL: http://localhost:3000
      ACCESS_TOKEN_SECRET: dev_local_access_secret_32_chars_minimum
      REFRESH_TOKEN_SECRET: dev_local_refresh_secret_32_chars_minimum
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: http://localhost:5000/auth/google/callback
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URL: http://localhost:5000/auth/github/callback
      GMAIL_HOST: ${GMAIL_HOST:-smtp.gmail.com}
      GMAIL_PORT: ${GMAIL_PORT:-587}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_PASSWORD: ${GMAIL_PASSWORD:-}
    command: >
      sh -c "npm install &&
             npx prisma db push &&
             npm run start:dev"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - socialhub-dev-network

  frontend:
    image: node:22-alpine
    container_name: socialhub-dev-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:5000/graphql
      NEXT_PUBLIC_WS_URL: ws://localhost:5000/graphql
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5000
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME:-}
      NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET:-}
    command: >
      sh -c "npm install --legacy-peer-deps &&
             npm run dev"
    depends_on:
      backend:
        condition: service_started
    networks:
      - socialhub-dev-network

volumes:
  postgres_dev_data:
  redis_dev_data:

networks:
  socialhub-dev-network:
    driver: bridge
